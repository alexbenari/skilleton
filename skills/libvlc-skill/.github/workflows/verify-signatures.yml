name: Verify Skill References

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/**'
      - '.github/workflows/verify-signatures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run reference verification
        run: node tests/verify-signatures.mjs
